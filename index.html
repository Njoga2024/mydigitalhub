<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinema Nest</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e50914;
  --red-dark:#b0060f;
  --red-glow:rgba(229,9,20,.18);
  --bg:#080808;
  --surface:#111;
  --surface2:#1a1a1a;
  --surface3:#222;
  --text:#fff;
  --muted:#888;
  --muted2:#555;
  --radius:8px;
  --nav-h:64px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Josefin Sans',sans-serif;overflow-x:hidden;}

/* ─── NAV ─── */
.nav{
  position:fixed;top:0;width:100%;z-index:1000;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 48px;height:var(--nav-h);
  transition:background .4s,backdrop-filter .4s,box-shadow .4s;
}
.nav.scrolled{
  background:rgba(8,8,8,.96);
  backdrop-filter:blur(20px);
  box-shadow:0 1px 0 rgba(255,255,255,.05);
}
.logo{
  font-family:'Josefin Sans',sans-serif;
  font-size:19px;color:var(--red);letter-spacing:3px;
  cursor:pointer;text-decoration:none;
  display:flex;align-items:center;gap:10px;
  transition:opacity .2s;
}
.logo:hover{opacity:.85;}
.logo-icon{
  width:26px;height:26px;
  background:var(--red);border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.logo-icon svg{width:14px;height:14px;fill:#fff;}
.nav-right{display:flex;align-items:center;gap:16px;}

/* Search */
.search-wrap{position:relative;display:flex;align-items:center;}
.search-icon-btn{
  background:none;border:none;cursor:pointer;
  color:var(--muted);padding:8px;
  display:flex;align-items:center;justify-content:center;
  transition:color .2s;
}
.search-icon-btn:hover{color:#fff;}
.search-icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;}
.search-expand{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  padding:9px 14px 9px 40px;border-radius:24px;
  color:var(--text);width:0;font-size:14px;font-family:inherit;
  transition:width .35s cubic-bezier(.4,0,.2,1),opacity .3s,border-color .2s;
  outline:none;opacity:0;pointer-events:none;
}
.search-wrap.open .search-expand{
  width:260px;opacity:1;pointer-events:all;
  border-color:rgba(255,255,255,.2);
}
.search-expand::placeholder{color:var(--muted);}
.search-wrap.open .search-icon-btn{position:absolute;left:10px;z-index:1;pointer-events:none;}

.nav-btn{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  color:var(--text);padding:8px 16px;border-radius:20px;
  cursor:pointer;font-size:13px;font-family:inherit;
  display:flex;align-items:center;gap:6px;
  transition:background .2s,border-color .2s;
  white-space:nowrap;
}
.nav-btn:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.2);} 
.nav-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;}

.nav-cta{
  background:var(--red);border:none;
  color:#fff;padding:8px 20px;border-radius:20px;
  cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;
  transition:background .2s,transform .15s;
  white-space:nowrap;
}
.nav-cta:hover{background:var(--red-dark);transform:scale(1.03);}

/* Trial badge */
#nav-trial-badge{display:none;align-items:center;gap:10px;}
.trial-pill-nav{
  display:flex;align-items:center;gap:6px;
  background:rgba(229,9,20,.1);border:1px solid rgba(229,9,20,.25);
  color:var(--red);font-size:11px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;padding:6px 12px;border-radius:20px;white-space:nowrap;
}
.trial-dot{width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse 2s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}

/* Expired state — urgent, high-contrast, attention-grabbing */
.trial-pill-nav.expired{
  background:rgba(229,9,20,.18);border:1px solid rgba(229,9,20,.6);
  color:#ff5c63;animation:expired-glow 1.6s ease-in-out infinite;
}
.trial-dot.expired-dot{background:#ff3b3b;animation:pulse .9s infinite;}
@keyframes expired-glow{0%,100%{box-shadow:0 0 0 0 rgba(229,9,20,.35);}50%{box-shadow:0 0 0 6px rgba(229,9,20,0);}}

.nav-pay-now{
  background:var(--red);border:none;color:#fff;
  padding:8px 16px;border-radius:20px;font-family:inherit;font-size:13px;
  font-weight:600;cursor:pointer;transition:background .2s,transform .15s;
  display:none;white-space:nowrap;
}
.nav-pay-now:hover{background:var(--red-dark);transform:scale(1.03);} 
.nav-pay-now.show{display:inline-block;}
.nav-pay-now.expired{
  background:#ff2d2d;animation:expired-btn-pulse 1.3s ease-in-out infinite;
  box-shadow:0 0 0 0 rgba(255,45,45,.5);
}
.nav-pay-now.expired:hover{background:#e00000;transform:scale(1.05);} 
@keyframes expired-btn-pulse{0%{box-shadow:0 0 0 0 rgba(255,45,45,.55);}70%{box-shadow:0 0 0 9px rgba(255,45,45,0);}100%{box-shadow:0 0 0 0 rgba(255,45,45,0);}}
.nav-signout{
  background:none;border:1px solid rgba(255,255,255,.12);color:var(--muted);
  padding:6px 12px;border-radius:20px;font-family:inherit;font-size:12px;
  cursor:pointer;transition:all .2s;
}
.nav-signout:hover{border-color:rgba(255,255,255,.3);color:#fff;}

/* ─── SEARCH OVERLAY ─── */
#search-results{
  position:fixed;top:var(--nav-h);left:0;right:0;bottom:0;
  background:rgba(8,8,8,.97);z-index:999;
  display:none;overflow-y:auto;padding:40px 48px;
}
#search-results.active{display:block;}
#search-heading{
  font-family:'Josefin Sans',sans-serif;font-size:24px;letter-spacing:1.5px;
  color:var(--muted);margin-bottom:24px;
}
.search-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:12px;
}

/* ─── HERO ─── */
.hero{
  height:100vh;min-height:600px;
  display:flex;align-items:flex-end;
  padding:0 48px 80px;
  background-size:cover;background-position:center top;
  position:relative;
  transition:background-image 1s ease;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:
    linear-gradient(to right,rgba(8,8,8,.95) 30%,rgba(8,8,8,.3) 65%,transparent 85%),
    linear-gradient(to top,rgba(8,8,8,1) 0%,rgba(8,8,8,.5) 30%,transparent 55%);
}
.hero-content{position:relative;max-width:580px;z-index:2;}

/* Top 10 banner inside hero (auto-scrolling) */
.top10-banner{
  position:absolute;left:48px;right:48px;bottom:24px;z-index:3;
  background:linear-gradient(90deg, rgba(0,0,0,.45), rgba(0,0,0,.2));
  padding:12px 14px;border-radius:10px;display:flex;align-items:center;gap:12px;align-items:center;
}
.top10-title{font-size:14px;color:var(--muted);font-weight:700;margin-right:8px;min-width:120px}
.top10-viewport{overflow:hidden;flex:1}
.top10-track{display:flex;gap:12px;align-items:center;will-change:transform}
.top10-item{min-width:180px;background:var(--surface2);border-radius:8px;overflow:hidden;text-decoration:none;color:#fff;flex-shrink:0}
.top10-item img{width:100%;height:100px;object-fit:cover;display:block}
.top10-item .meta{padding:8px;font-size:13px}
.top10-item .meta .title{font-weight:600;color:#fff}
.top10-item .meta .sub{font-size:12px;color:var(--muted);margin-top:4px}
@media(max-width:768px){.top10-item{min-width:140px}.top10-item img{height:80px}.top10-banner{left:18px;right:18px}}

.hero-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--red);margin-bottom:20px;
  border:1px solid rgba(229,9,20,.4);
  padding:5px 12px;border-radius:4px;
  background:rgba(229,9,20,.08);
}
.hero-badge svg{width:10px;height:10px;fill:currentColor;}

.hero h1{
  font-family:'Josefin Sans',sans-serif;
  font-size:clamp(52px,8vw,100px);
  line-height:.9;letter-spacing:1px;
  margin-bottom:18px;
  text-shadow:0 2px 20px rgba(0,0,0,.5);
}
.hero-meta{
  display:flex;align-items:center;gap:10px;
  margin-bottom:16px;font-size:13px;color:var(--muted);flex-wrap:wrap;
}
.hero-rating{
  color:#fbbf24;font-weight:700;font-size:13px;
  display:flex;align-items:center;gap:3px;
}
.hero-dot{width:3px;height:3px;border-radius:50%;background:var(--muted2);} 
.hero p{
  font-size:15px;line-height:1.65;color:rgba(255,255,255,.7);
  margin-bottom:28px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;}

.btn-play{
  background:#fff;color:#000;
  border:none;padding:13px 28px;border-radius:6px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:8px;
  transition:background .2s,transform .1s;
  letter-spacing:.2px;
}
.btn-play:hover{background:#e8e8e8;transform:scale(1.02);} 
.btn-play svg{width:16px;height:16px;fill:currentColor;flex-shrink:0;}

.btn-info{
  background:rgba(255,255,255,.12);color:#fff;
  border:1px solid rgba(255,255,255,.15);
  padding:13px 24px;border-radius:6px;
  font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:8px;
  backdrop-filter:blur(4px);
  transition:background .2s,border-color .2s;
}
.btn-info:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3);} 
.btn-info svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}

/* ─── GENRE NAV ─── */
.genre-nav{
  display:flex;gap:6px;padding:20px 48px;
  overflow-x:auto;scrollbar-width:none;
  position:relative;z-index:1;
}
.genre-nav::-webkit-scrollbar{display:none;} 
.genre-pill{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  color:var(--muted);padding:7px 18px;border-radius:20px;
  font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit;
  font-weight:500;letter-spacing:.3px;
  transition:all .2s;
}
.genre-pill:hover{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.18);} 
.genre-pill.active{
  background:var(--red);color:#fff;border-color:var(--red);
  box-shadow:0 0 16px rgba(229,9,20,.35);
}

/* ─── ROWS ─── */
.rows-wrap{padding:0 0 80px;transition:opacity .2s;}
.row{margin-bottom:4px;}

.row-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:28px 48px 12px;
}
.row-header h2{
  font-family:'Josefin Sans',sans-serif;
  font-size:20px;letter-spacing:1.5px;
  display:flex;align-items:center;gap:10px;
  color:#fff;
}
.row-emoji{font-size:16px;} 
.see-all{
  font-size:11px;color:var(--red);cursor:pointer;
  text-transform:uppercase;letter-spacing:1.5px;font-weight:700;
  background:none;border:none;font-family:inherit;
  transition:opacity .2s;
  display:flex;align-items:center;gap:4px;
}
.see-all:hover{opacity:.75;} 
.see-all svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;}

.row-container{position:relative;} 

/* Fade edges on scroll rows */
.row-container::before,
.row-container::after{
  content:'';position:absolute;top:0;bottom:0;z-index:8;
  width:48px;pointer-events:none;
  transition:opacity .3s;
}
.row-container::before{
  left:0;
  background:linear-gradient(to right,var(--bg),transparent);
}
.row-container::after{
  right:0;
  background:linear-gradient(to left,var(--bg),transparent);
}

.row-posters{
  display:flex;gap:8px;
  overflow-x:auto;scroll-behavior:smooth;
  padding:8px 48px 24px;
  scrollbar-width:none;
}
.row-posters::-webkit-scrollbar{display:none;} 

/* ─── ARROWS ─── */
.arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  width:40px;height:72px;
  background:rgba(8,8,8,.9);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:10;
  transition:background .2s,opacity .2s;
  border:none;color:#fff;opacity:0;
}
.row-container:hover .arrow{opacity:1;} 
.arrow:hover{background:rgba(20,20,20,.98);} 
.arrow.left{left:0;border-radius:0 6px 6px 0;} 
.arrow.right{right:0;border-radius:6px 0 0 6px;} 
.arrow svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5;}

/* ─── CARDS ─── */
.poster-landscape{
  width:260px;height:148px;
  border-radius:var(--radius);overflow:hidden;
  cursor:pointer;flex-shrink:0;position:relative;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;
  background:var(--surface2);
}
.poster-portrait{
  width:150px;height:225px;
  border-radius:var(--radius);overflow:hidden;
  cursor:pointer;flex-shrink:0;position:relative;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;
  background:var(--surface2);
}
.poster-landscape:hover,.poster-portrait:hover{
  transform:scale(1.06) translateY(-4px);
  box-shadow:0 16px 48px rgba(0,0,0,.8);
  z-index:5;
}
.poster-landscape img,.poster-portrait img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .4s;
}
.poster-landscape:hover img,.poster-portrait:hover img{transform:scale(1.04);} 

.card-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.9) 0%,rgba(0,0,0,.4) 45%,transparent 70%);
  opacity:0;transition:opacity .3s;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:10px;
}
.poster-landscape:hover .card-overlay,
.poster-portrait:hover .card-overlay{opacity:1;} 

.card-title{font-size:12px;font-weight:600;line-height:1.3;margin-bottom:3px;} 
.card-year{font-size:11px;color:rgba(255,255,255,.5);} 

.card-play-btn{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.7);
  width:40px;height:40px;border-radius:50%;
  background:rgba(229,9,20,.9);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .25s,transform .25s;
}
.poster-landscape:hover .card-play-btn,
.poster-portrait:hover .card-play-btn{opacity:1;transform:translate(-50%,-50%) scale(1);} 
.card-play-btn svg{width:14px;height:14px;fill:#fff;margin-left:2px;} 

.card-mylist{
  position:absolute;top:8px;right:8px;
  width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.7);border:1.5px solid rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s,background .2s,transform .2s;
  cursor:pointer;
}
.poster-landscape:hover .card-mylist,
.poster-portrait:hover .card-mylist{opacity:1;} 
.card-mylist:hover{background:var(--red);border-color:var(--red);transform:scale(1.1);} 

/* ── PERSISTENT CARD TITLE ── */
.card-wrap{display:inline-flex;flex-direction:column;flex-shrink:0;cursor:pointer;} 
.card-wrap .poster-landscape,.card-wrap .poster-portrait{flex-shrink:0;} 
.card-label{
  font-size:12px;font-weight:500;color:rgba(255,255,255,.85);
  line-height:1.35;margin-top:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:100%;padding:0 2px;
}
.card-mylist svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.5;} 

/* ─── SKELETON ─── */
.skeleton{
  background:linear-gradient(90deg,var(--surface2) 25%,#252525 50%,var(--surface2) 75%);
  background-size:200% 100%;
  animation:shimmer 1.6s infinite;
  border-radius:var(--radius);flex-shrink:0;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}} 

/* ─── MODAL ─── */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.8);
  z-index:2000;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s;
  padding:20px;
}
.modal-backdrop.open{opacity:1;pointer-events:all;} 
.modal{
  background:#161616;border-radius:14px;
  width:100%;max-width:820px;max-height:90vh;
  overflow-y:auto;position:relative;
  transform:scale(.94) translateY(16px);
  transition:transform .35s cubic-bezier(.34,1.2,.64,1);
  scrollbar-width:none;
  border:1px solid rgba(255,255,255,.06);
  box-shadow:0 32px 80px rgba(0,0,0,.8);
}
.modal-backdrop.open .modal{transform:scale(1) translateY(0);} 
.modal::-webkit-scrollbar{display:none;} 

.modal-hero-wrap{position:relative;} 
.modal-backdrop-img{
  width:100%;aspect-ratio:16/9;object-fit:cover;
  border-radius:14px 14px 0 0;display:block;
  background:var(--surface2);
}
.modal-hero-grad{position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(to top,#161616,transparent);} 
.modal-close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;z-index:10;transition:background .2s,transform .2s;} 
.modal-close:hover{background:rgba(0,0,0,.95);transform:scale(1.08);} 
.modal-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;} 

.modal-body{padding:0 32px 32px;} 
.modal-title{font-family:'Josefin Sans',sans-serif;font-size:42px;letter-spacing:1px;margin-bottom:10px;line-height:1;} 
.modal-meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:16px;flex-wrap:wrap;} 
.modal-rating{color:#fbbf24;font-weight:700;} 
.modal-sep{width:3px;height:3px;border-radius:50%;background:var(--muted2);} 
.modal-overview{font-size:14px;line-height:1.75;color:#bbb;margin-bottom:24px;} 
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;} 

/* ─── MY LIST PANEL ─── */
.mylist-panel{position:fixed;top:0;right:-420px;height:100%;width:380px;background:#111;z-index:2001;transition:right .4s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding:24px;box-shadow:-16px 0 60px rgba(0,0,0,.7);scrollbar-width:thin;scrollbar-color:var(--surface3) transparent;border-left:1px solid rgba(255,255,255,.05);} 
.mylist-panel.open{right:0;} 
.mylist-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;} 
.mylist-header h2{font-family:'Josefin Sans',sans-serif;font-size:26px;letter-spacing:1px;} 
.mylist-close{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--muted);cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s;} 
.mylist-close:hover{background:rgba(255,255,255,.12);color:#fff;} 
.mylist-empty{color:var(--muted);font-size:14px;margin-top:40px;text-align:center;line-height:1.7;} 
.mylist-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;transition:background .2s;cursor:pointer;margin-bottom:4px;} 
.mylist-item:hover{background:var(--surface);} 
.mylist-item img{width:72px;height:44px;border-radius:6px;object-fit:cover;background:var(--surface2);flex-shrink:0;} 
.mylist-item-info{flex:1;min-width:0;} 
.mylist-item-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} 
.mylist-item-type{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;} 
.mylist-item-rm{background:none;border:none;color:var(--muted2);cursor:pointer;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:color .2s,background .2s;flex-shrink:0;} 
.mylist-item-rm:hover{color:var(--red);background:rgba(229,9,20,.1);} 
.mylist-item-rm svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;} 

/* ─── TOAST ─── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(12px);background:rgba(30,30,30,.96);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(16px);color:#fff;font-size:13px;padding:10px 20px;border-radius:24px;z-index:3000;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5);} 
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);} 

/* ─── TRAILER LIGHTBOX ─── */
.trailer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:3000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;padding:20px;backdrop-filter:blur(8px);} 
.trailer-backdrop.open{opacity:1;pointer-events:all;} 
.trailer-box{width:100%;max-width:900px;position:relative;transform:scale(.94) translateY(20px);transition:transform .35s cubic-bezier(.34,1.2,.64,1);} 
.trailer-backdrop.open .trailer-box{transform:scale(1) translateY(0);} 
.trailer-ratio{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 32px 80px rgba(0,0,0,.9);} 
.trailer-ratio iframe{position:absolute;inset:0;width:100%;height:100%;border:none;} 
.trailer-close{position:absolute;top:-48px;right:0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s,transform .2s;font-size:0;} 
.trailer-close:hover{background:rgba(255,255,255,.2);transform:scale(1.08);} 
.trailer-close svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.5;} 
.trailer-label{position:absolute;top:-48px;left:0;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:8px;line-height:38px;} 
.trailer-label span{color:var(--red);} 
.trailer-no{padding:48px 32px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:12px;} 
.trailer-no svg{width:40px;height:40px;stroke:rgba(255,255,255,.15);fill:none;stroke-width:1.5;} 

/* btn-trailer style */
.btn-trailer{background:rgba(229,9,20,.12);color:var(--red);border:1.5px solid rgba(229,9,20,.4);padding:13px 22px;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;transition:background .2s,border-color .2s,transform .15s;} 
.btn-trailer:hover{background:rgba(229,9,20,.22);border-color:var(--red);transform:scale(1.02);} 
.btn-trailer svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;} 

/* ─── FOOTER ─── */
footer{border-top:1px solid rgba(255,255,255,.05);padding:28px 48px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:20px;} 
footer p{font-size:11px;color:rgba(255,255,255,.22);line-height:1.6;max-width:560px;} 
footer a{font-size:11px;color:rgba(255,255,255,.3);text-decoration:none;transition:color .2s;} 
footer a:hover{color:var(--red);} 

/* ─── RESPONSIVE ─── */
@media(max-width:768px){

}
